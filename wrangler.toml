name = "weddingflow"
main = ".open-next/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "weddingflow"
database_id = "9f8ea956-80ca-40c0-a22f-fb16c7a09208"

# Cron trigger para recordatorios automáticos (Fase 2)
[triggers]
crons = ["0 8 * * *"]
