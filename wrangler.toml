name = "weddingflow"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "weddingflow-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "weddingflow-media"

# Cron trigger para recordatorios automáticos (Fase 2)
[triggers]
crons = ["0 8 * * *"]
